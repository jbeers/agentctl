site_name: agentctl
site_description: Provision private, disposable Hermes coding agents on DigitalOcean
site_url: https://jbeers.github.io/agentctl/
repo_url: https://github.com/jbeers/agentctl
repo_name: jbeers/agentctl
edit_uri: edit/main/docs/
copyright: Copyright &copy; agentctl contributors

nav:
  - Home: index.md
  - Getting Started:
      - Prerequisites: prerequisites.md
      - Install agentctl: install.md
      - Create your first agent: first-agent.md
  - Concepts:
      - Persistence, billing, and cleanup: persistence.md
      - Project status and limitations: project-status.md
  - Guides:
      - Bring up an agent: agent-up.md
      - Access a running agent: agent-access.md
      - Workspace and Compose: compose-workspace.md
      - Restore archives: archives.md
      - Rotate bundle credentials: credential-rotation.md
      - Take an agent down safely: agent-down.md
  - Reference:
      - Agent bundles and inspection: agent-bundles.md
      - Layered agent health: agent-status.md
  - Troubleshooting: troubleshooting.md
  - Security: security.md
  - Roadmap: https://github.com/jbeers/agentctl/blob/main/v3/README.md
  - Contributing: https://github.com/jbeers/agentctl/blob/main/CONTRIBUTING.md
  - Releases:
      - Release policy: releases/index.md
      - v0.1.0-alpha.2: releases/v0.1.0-alpha.2.md
      - v0.1.0-alpha.1: releases/v0.1.0-alpha.1.md

theme:
  name: material
  icon:
    logo: material/robot-industrial
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jbeers/agentctl
      name: agentctl on GitHub
