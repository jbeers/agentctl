name: Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/check-docs'
      - 'box.json'
      - 'src/services/BundleService.bx'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'v3/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/check-docs'
      - 'box.json'
      - 'src/services/BundleService.bx'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'v3/**'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install pinned documentation toolchain
        run: |
          python -m pip install --disable-pip-version-check pip==26.0.1
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
          python --version | grep -F 'Python 3.13.12'
          python -m mkdocs --version | grep -F 'mkdocs, version 1.6.1'
          python -m pip show mkdocs-material | grep -F 'Version: 9.7.7'

      - name: Build strict documentation site
        run: scripts/check-docs site

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
